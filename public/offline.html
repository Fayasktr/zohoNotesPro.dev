<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Zoho Notes</title>
    <meta name="theme-color" content="#0a0a0c">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent: #6d5dfc;
            --accent-glow: rgba(109, 93, 252, 0.4);
            --text-main: #ffffff;
            --text-dim: #a0a0a5;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .icon-box {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: rgba(109, 93, 252, 0.15);
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #6d5dfc 0%, #4b3bcb 100%);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #ff5252;
            background: rgba(255, 82, 82, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 82, 82, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff5252;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon-box">
            <i data-lucide="wifi-off" style="width: 36px; height: 36px;"></i>
        </div>
        <h1>You are Offline</h1>
        <p>It looks like your internet connection was lost. Please check your connection and try refreshing the page.</p>

        <button class="btn-retry" onclick="window.location.reload()">
            <i data-lucide="rotate-cw" style="width: 18px; height: 18px;"></i>
            Retry Connection
        </button>

        <div class="status-badge">
            <span class="status-dot"></span>
            No Network Connection
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Auto reload when network comes back online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>

</html>
